name: flowin
description: "Flowin - Aplikasi Manajemen Keuangan Pribadi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Google Fonts (Plus Jakarta Sans)
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # UUID
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/flowin.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/flowin.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/flowin.png
    - assets/logo/


  # assets:
